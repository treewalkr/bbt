[package]
name = "bbt-server"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bbt-domain = { version = "0.1.0", path = "../domain" }
chrono = "0.4.45"
dotenvy = "0.15.7"
encoding_rs = "0.8.44"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "form", "http2"] }
rusqlite = { version = "0.42.0", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "time"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
